<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Aplica o tema antes da renderização e evita piscar a versão clara. */
      (function () {
        try {
          var saved = localStorage.getItem('planaltina-appearance-v1');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = saved === 'dark' || (saved !== 'light' && prefersDark);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="icon" href="%BASE_URL%icons/mapa-planaltina.svg" />
    <title>Mapa Planaltina GO</title>
    <meta name="description" content="Mapa interativo e explorador de serviços de Planaltina, Goiás (IBGE 5217609) com modo escuro, rotas locais, filtros avançados e fontes auditáveis." />
    <meta property="og:title" content="Mapa Planaltina GO" />
    <meta property="og:description" content="Mapa interativo e explorador de serviços de Planaltina, Goiás (IBGE 5217609) com modo escuro, rotas locais, filtros avançados e fontes auditáveis." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F5F0E6] text-neutral-900 font-sans antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
