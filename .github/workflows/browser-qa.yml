name: Browser QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mapa-planaltina-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências do projeto
        run: npm ci
      - name: Instalar ferramentas de QA sem alterar o lockfile
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.64.1 @axe-core/playwright@4.13.0
      - name: Preparar Chromium e WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Preparar rede viária real para Browser QA
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          mkdir -p /tmp/planaltina-osm
          curl --fail --location --retry 2 --max-time 240 \
            --output /tmp/planaltina-osm/centro-oeste.osm.pbf \
            https://download.geofabrik.de/south-america/brazil/centro-oeste-latest.osm.pbf
          osmium extract --bbox=-48.1073,-15.5022,-47.4625,-15.0166 \
            --strategy=complete_ways \
            /tmp/planaltina-osm/centro-oeste.osm.pbf \
            -o /tmp/planaltina-osm/municipio.osm.pbf
          osmium tags-filter -t /tmp/planaltina-osm/municipio.osm.pbf \
            w/highway -o /tmp/planaltina-osm/roads.osm.pbf
          osmium export --config scripts/osmium-export-config.json \
            -f geojson /tmp/planaltina-osm/roads.osm.pbf \
            -o /tmp/planaltina-osm/roads.geojson
          node --import tsx scripts/import-roads.ts \
            /tmp/planaltina-osm/roads.geojson public/data/road-graph.json
      - name: Executar fluxos mobile, desktop, PWA e acessibilidade
        run: npx playwright test --config=playwright.pages.config.mjs
      - name: Preservar traces e screenshots em falhas
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-qa-failure-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
