name: Verificar e publicar Mapa Planaltina GO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mapa-planaltina-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar TypeScript
        run: npm run lint
      - name: Executar testes
        run: npm test
      - name: Restaurar último snapshot CNES validado
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/cnes/snapshot.json
          key: cnes-snapshot-v1-restore-${{ github.run_id }}
          restore-keys: cnes-snapshot-v1-
      - name: Restaurar último catálogo OSM validado
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/osm/snapshot.json
          key: osm-planaltina-v1-restore-${{ github.run_id }}
          restore-keys: osm-planaltina-v1-
      - name: Preparar catálogo regional OSM sem API paga
        if: github.event_name == 'schedule' || hashFiles('.cache/osm/snapshot.json') == ''
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          mkdir -p /tmp/planaltina-osm
          curl --fail --location --retry 2 --max-time 240 \
            --output /tmp/planaltina-osm/centro-oeste.osm.pbf \
            https://download.geofabrik.de/south-america/brazil/centro-oeste-latest.osm.pbf
          osmium extract --bbox=-48.1073,-15.5022,-47.4625,-15.0166 \
            --strategy=complete_ways \
            /tmp/planaltina-osm/centro-oeste.osm.pbf \
            -o /tmp/planaltina-osm/municipio.osm.pbf
          osmium tags-filter -t /tmp/planaltina-osm/municipio.osm.pbf \
            nwr/amenity nwr/shop nwr/office nwr/leisure nwr/tourism \
            nwr/public_transport nwr/healthcare nwr/highway=bus_stop \
            -o /tmp/planaltina-osm/pois.osm.pbf
          osmium export --config scripts/osmium-export-config.json \
            -f geojson /tmp/planaltina-osm/pois.osm.pbf \
            -o /tmp/planaltina-osm/pois.geojson
          node --import tsx scripts/import-geofabrik-geojson.ts \
            /tmp/planaltina-osm/pois.geojson .cache/osm/snapshot.json
      - name: Construir site do GitHub Pages
        id: static-build
        run: npm run build:pages
        env:
          CNES_SNAPSHOT_PATH: .cache/cnes/snapshot.json
          OSM_SNAPSHOT_PATH: .cache/osm/snapshot.json
      - name: Verificar artefato estático
        run: npm run verify:pages
      - name: Preservar snapshot CNES após validação do artefato
        if: github.event_name != 'pull_request' && hashFiles('.cache/cnes/snapshot.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/cnes/snapshot.json
          key: cnes-snapshot-v1-${{ hashFiles('.cache/cnes/snapshot.json') }}
      - name: Preservar catálogo colaborativo após validação
        if: github.event_name != 'pull_request' && hashFiles('.cache/osm/snapshot.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/osm/snapshot.json
          key: osm-planaltina-v1-${{ hashFiles('.cache/osm/snapshot.json') }}
      - name: Arquivar snapshots auditáveis
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: municipal-snapshot-${{ github.sha }}-${{ github.run_id }}
          path: dist/data/
          retention-days: 90
          if-no-files-found: error
      - name: Configurar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Enviar site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Verificar site publicado
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          root="${PAGE_URL%/}/"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors -o /tmp/index.html "$root"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors -o /tmp/fontes.html "${root}fontes/"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors -o /tmp/points.json "${root}data/points.json"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors -o /tmp/manifest.webmanifest "${root}manifest.webmanifest"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors -o /tmp/sw.js "${root}sw.js"
          grep -q '<title>Mapa Planaltina GO</title>' /tmp/index.html
          grep -q '<title>Mapa Planaltina GO</title>' /tmp/fontes.html
          grep -q '"ibgeCode":"5217609"' /tmp/points.json
          grep -q '"start_url": "/mapa-planaltina-go/"' /tmp/manifest.webmanifest
          grep -q '/mapa-planaltina-go/data/points.json' /tmp/sw.js
