version: 2
updates:
  # Atualizações sempre entram por PR e passam nos mesmos testes do projeto.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "09:30"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 2
